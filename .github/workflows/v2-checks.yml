name: V2 checks

on:
  pull_request:
  push:
    branches:
      - main
      - "cleanup/**"
      - "enhance/**"
      - "hotfix/**"
      - "fix/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
