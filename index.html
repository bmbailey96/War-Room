<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>War Room</title>
<style>
:root{--bg:#0c0d0e;--panel:#141619;--line:#292d31;--text:#f1f1ee;--muted:#8f969d;--good:#a9e3bd;--warn:#e8c58c;--bad:#eaa2a2;--accent:#d7ff66}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:920px;margin:0 auto;padding:24px 18px 70px} header{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
h1{font-size:15px;letter-spacing:.12em;margin:0;color:var(--accent)} .sub{color:var(--muted);font-size:12px;margin-top:5px}
select,button{background:#101214;border:1px solid var(--line);color:var(--text);font:inherit;border-radius:5px;padding:8px 10px}
button{cursor:pointer} button:hover{border-color:#596067}.top-controls{display:flex;gap:8px;align-items:center}
.hero{border:1px solid var(--line);background:var(--panel);padding:20px;border-radius:8px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--muted);margin-bottom:7px}.hero h2{font:600 26px/1.15 system-ui,sans-serif;margin:0 0 8px}
.meta{color:var(--muted)} .metric{display:flex;gap:20px;margin-top:15px;flex-wrap:wrap}.metric b{font-size:19px;color:var(--text)}.metric span{color:var(--muted);font-size:11px;display:block}
.call{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:17px 0;border-top:1px solid var(--line)}.call:first-child{border-top:0}
.start{font:650 20px/1.2 system-ui,sans-serif}.sit{color:var(--muted);margin-top:3px}.gain{font-weight:700;color:var(--good);white-space:nowrap}.why{margin-top:8px;color:#c7c9c8;font-family:system-ui,sans-serif}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted);font-size:10px}.high{color:var(--good)}.medium{color:var(--warn)}.low{color:var(--bad)}
section{border:1px solid var(--line);background:var(--panel);padding:17px 20px;border-radius:8px;margin-top:14px}section h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 4px;border-top:1px solid var(--line);font-size:12px}th{color:var(--muted);border-top:0;font-weight:400}.pts{text-align:right}
.status{color:var(--muted);padding:18px 0}.watch{margin:7px 0 0;padding-left:20px;font-family:system-ui,sans-serif;color:#c7c9c8}
footer{margin-top:25px;color:var(--muted);font-size:11px}a{color:var(--muted)}.source-note{margin-top:12px;font-size:10px;color:#686e73}
@media(max-width:620px){header{align-items:flex-start;flex-direction:column}.top-controls{width:100%}select{flex:1}.hero h2{font-size:23px}.call{grid-template-columns:1fr}.gain{justify-self:start}td:nth-child(4),th:nth-child(4){display:none}}
</style>
</head>
<body><main>
<header><div><h1>WAR ROOM</h1><div class="sub" id="weekline">loading the board</div></div>
<div class="top-controls"><select id="league" aria-label="League"></select><button id="refresh">refresh</button></div></header>

<div class="hero">
<div class="eyebrow">THE CALL</div>
<h2 id="headline">Reading the league...</h2>
<div class="meta" id="opponent"></div>
<div class="metric"><div><b id="current">-</b><span>CURRENT</span></div><div><b id="optimal">-</b><span>BEST LINEUP</span></div><div><b id="gain">-</b><span>POINTS LEFT</span></div></div>
</div>

<section><h3>START / SIT</h3><div id="calls"><div class="status">Building projections from actual weekly production...</div></div></section>
<section><h3>LINEUP</h3><div id="lineup"><div class="status">Loading...</div></div></section>
<section><h3>BEFORE KICKOFF</h3><div id="watch" class="status">Checking current injury and role news...</div></section>

<footer><a href="/legacy.html">open the full old war room</a><div class="source-note" id="source"></div></footer>
</main>
<script>
const $=id=>document.getElementById(id);
let currentLeague=null, baseData=null;

function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function conf(c){return '<span class="'+String(c||"").toLowerCase()+'">'+esc(c||"")+'</span>'}
function renderBase(d){
  baseData=d; currentLeague=d.league.id;
  $("weekline").textContent=d.league.name+" · WEEK "+d.week;
  $("opponent").textContent="vs "+d.opponent;
  $("current").textContent=(d.currentTotal??0).toFixed(1);
  $("optimal").textContent=(d.optimalTotal??0).toFixed(1);
  $("gain").textContent="+"+(d.gain??0).toFixed(1);
  $("source").textContent=d.sourceNote||"";
  if(!d.calls?.length){
    $("headline").textContent="Keep the lineup.";
    $("calls").innerHTML='<div class="status">No bench player clears a current starter on the projection model.</div>';
  }else{
    const top=d.calls[0];
    $("headline").textContent="Start "+top.start.name+(top.sit?" over "+top.sit.name:"")+".";
    $("calls").innerHTML=d.calls.map(c=>'<div class="call"><div><div class="start">START '+esc(c.start.name)+'</div><div class="sit">'+(c.sit?'sit '+esc(c.sit.name):'open slot')+' · '+esc(c.slot)+'</div><div class="tags"><span class="tag">'+conf(c.start.confidence)+' confidence</span><span class="tag">'+esc(c.start.opp?'vs '+c.start.opp:'opponent TBD')+'</span>'+(c.start.fallback?'<span class="tag low">provider fallback</span>':'')+'</div></div><div class="gain">+'+Number(c.gain||0).toFixed(1)+'</div></div>').join("");
  }
  const opt=d.optimal||[];
  $("lineup").innerHTML='<table><thead><tr><th>SLOT</th><th>PLAYER</th><th>RANGE</th><th>OPP</th><th class="pts">PROJ</th></tr></thead><tbody>'+opt.map(x=>{
    const p=x.player; if(!p)return '<tr><td>'+esc(x.slot)+'</td><td class="low">empty</td><td></td><td></td><td></td></tr>';
    return '<tr><td>'+esc(x.slot)+'</td><td>'+esc(p.name)+(p.injury?' <span class="low">['+esc(p.injury)+']</span>':'')+'</td><td>'+Number(p.floor||0).toFixed(1)+'–'+Number(p.ceiling||0).toFixed(1)+'</td><td>'+esc(p.opp||"")+'</td><td class="pts">'+Number(p.projection||0).toFixed(1)+'</td></tr>';
  }).join("")+'</tbody></table>';
}
function renderAnalysis(a){
  if(!a?.analysis)return;
  const x=a.analysis;
  if(x.summary)$("headline").textContent=x.summary;
  if(x.calls?.length){
    $("calls").innerHTML=x.calls.map(c=>{
      const fallback=baseData?.players?.find(p=>p.name===c.start)?.fallback;
      return '<div class="call"><div><div class="start">'+esc(c.verdict||"START")+' '+esc(c.start||"")+'</div><div class="sit">'+(c.sit?'over '+esc(c.sit):esc(c.slot||""))+'</div><div class="why">'+esc(c.why||"")+'</div><div class="tags"><span class="tag">'+conf(c.confidence)+' confidence</span>'+(c.sourceDate?'<span class="tag">news '+esc(c.sourceDate)+'</span>':'')+(fallback?'<span class="tag low">provider fallback</span>':'')+'</div></div></div>';
    }).join("");
  }
  $("watch").innerHTML=x.watch?.length?'<ul class="watch">'+x.watch.map(w=>'<li>'+esc(w)+'</li>').join("")+'</ul>':'<div class="status">Nothing specific to monitor.</div>';
}
async function load(force=false){
  $("refresh").disabled=true;
  try{
    const q=currentLeague?'?league='+encodeURIComponent(currentLeague):'';
    const r=await fetch('/.netlify/functions/lineup'+q); const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||"lineup failed");
    const sel=$("league");
    sel.innerHTML=d.leagues.map(l=>'<option value="'+esc(l.id)+'"'+(l.id===d.league.id?' selected':'')+'>'+esc(l.name)+'</option>').join("");
    renderBase(d);
    $("watch").innerHTML='<div class="status">Checking current injury, practice, and role news...</div>';
    const sep=q?'&':'?';
    fetch('/.netlify/functions/lineup-analysis'+q+sep+(force?'refresh=1':'refresh=0'))
      .then(r=>r.json()).then(renderAnalysis)
      .catch(e=>{$("watch").innerHTML='<div class="status">News check failed: '+esc(e.message)+'</div>'});
  }catch(e){
    $("headline").textContent="Could not build the lineup.";
    $("calls").innerHTML='<div class="status">'+esc(e.message)+'</div>';
  }finally{$("refresh").disabled=false}
}
$("league").addEventListener("change",e=>{currentLeague=e.target.value;load(false)});
$("refresh").addEventListener("click",()=>load(true));
load(false);
</script></body></html>
